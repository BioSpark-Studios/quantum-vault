[workspace]
resolver = "2"
members = [
    "crates/myth-wire",
    "crates/mythos",
    "crates/qgcp",
    "crates/loom-engine",
    "crates/theater",
    "modules/vault-core",
    "modules/vault-scrolls",
    "modules/vault-glyphs",
    "modules/personas",
    "modules/license-core",
    "modules/storefront",
    "modules/dj-deck",
    "modules/remix-engine",
    "modules/user-profile",
    "bins/vaultforge",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
egui = "0.28"
eframe = "0.28"
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
image = { version = "0.25", default-features = false, features = ["png"] }
