[package]
name = "vaultforge"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vaultforge"
path = "src/main.rs"

[features]
default = []
ui = ["theater/ui", "dep:eframe", "dep:egui"]

[dependencies]
myth-wire = { path = "../../crates/myth-wire" }
mythos = { path = "../../crates/mythos" }
qgcp = { path = "../../crates/qgcp" }
theater = { path = "../../crates/theater" }
vault-core = { path = "../../modules/vault-core" }
vault-scrolls = { path = "../../modules/vault-scrolls" }
vault-glyphs = { path = "../../modules/vault-glyphs" }
personas = { path = "../../modules/personas" }
license-core = { path = "../../modules/license-core" }
storefront = { path = "../../modules/storefront" }
dj-deck = { path = "../../modules/dj-deck" }
remix-engine = { path = "../../modules/remix-engine" }
user-profile = { path = "../../modules/user-profile" }
loom-engine = { path = "../../crates/loom-engine" }
quill = { path = "../../crates/quill" }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
eframe = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
